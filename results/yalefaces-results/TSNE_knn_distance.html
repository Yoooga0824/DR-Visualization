
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSNE 边界分析可视化 - 交互式</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            background: linear-gradient(120deg, #e0eafc 0%, #cfdef3 100%);
        }
        .container {
            max-width: 1400px;
            margin: 32px auto;
            background: #fff;
            padding: 32px 24px 24px 24px;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
            border: 1.5px solid #e3e8f0;
        }
        .header {
            position: relative;
            text-align: center;
            margin-bottom: 28px;
            padding: 24px 18px 28px 18px;
            border-radius: 14px;
            background: linear-gradient(90deg, rgba(54,209,196,0.15) 0%, rgba(91,134,229,0.15) 100%);
            border: 1px solid #e3e8f0;
        }
        .header::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            box-shadow: 0 10px 28px rgba(91, 134, 229, 0.18) inset;
            pointer-events: none;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #2b5876 0%, #4e4376 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1.2px;
            margin: 0 0 10px 0;
        }
        .header .sub {
            color: #5a6d8a;
            font-size: 1.02rem;
            margin: 0 auto 10px auto;
        }
        .pills {
            display: inline-flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border: 1px solid #e3e8f0;
            color: #2b5876;
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.92rem;
            box-shadow: 0 2px 8px rgba(31, 38, 135, 0.08);
        }
        .content {
            display: flex;
            gap: 28px;
            min-height: 600px;
        }
        @media (max-width: 1100px) {
            .content { flex-direction: column; }
        }
        .plot-container {
            flex: 3;
            border-radius: 12px;
            background: #f7fafd;
            box-shadow: 0 2px 12px 0 rgba(31, 38, 135, 0.07);
            padding: 18px 10px 10px 10px;
            border: 1.5px solid #e3e8f0;
        }
        .info-panel {
            flex: 1;
            border-radius: 12px;
            background: #f9fbfd;
            box-shadow: 0 2px 12px 0 rgba(31, 38, 135, 0.07);
            padding: 20px 18px;
            border: 1.5px solid #e3e8f0;
            min-width: 320px;
        }
        .metrics {
            margin-bottom: 18px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        @media (max-width: 900px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px) {
            .metrics-grid { grid-template-columns: 1fr; }
        }
        .metric-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 12px;
            border-radius: 12px;
            border: 1px solid #e3e8f0;
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
            box-shadow: 0 4px 12px rgba(31, 38, 135, 0.08);
        }
        .metric-icon {
            width: 34px; height: 34px; border-radius: 10px; flex: 0 0 34px;
            display: grid; place-items: center; font-size: 18px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, #36d1c4 0%, #5b86e5 100%);
            box-shadow: 0 4px 10px rgba(91, 134, 229, 0.28);
        }
        .metric-content strong {
            display: block; font-size: 1.06rem; color: #2b5876;
        }
        .metric-content span {
            display: block; font-size: 0.86rem; color: #5a6d8a;
        }
        .point-info {
            margin-top: 18px;
            padding: 16px 14px;
            background: linear-gradient(180deg, #fffdf3 0%, #fff8d6 100%);
            border-radius: 12px;
            font-size: 1.01rem;
            box-shadow: 0 6px 18px rgba(255, 215, 0, 0.15);
            border: 1px solid #f3e7a9;
        }
        .point-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.15rem;
            color: #8a6d00;
        }
        .info-header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #f0e6a6;
            color: #6b5b00;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 1px 4px rgba(138, 109, 0, 0.08);
        }
        .chip .dot {
            width: 8px; height: 8px; border-radius: 50%; background: #d4a017;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            border: 1px solid transparent;
        }
        .badge-normal {
            background: linear-gradient(135deg, #e3f2ff 0%, #f0f7ff 100%);
            color: #1a6bb8;
            border-color: #cfe7ff;
        }
        .badge-anomalous {
            background: linear-gradient(135deg, #ffe3f0 0%, #fff0f5 100%);
            color: #b81a4c;
            border-color: #ffd1e6;
        }
        .badge-yes {
            background: linear-gradient(135deg, #e7ffe9 0%, #f2fff4 100%);
            color: #0e7a2f;
            border-color: #c9f1d2;
        }
        .badge-no {
            background: #f5f7fb;
            color: #6b778c;
            border-color: #e1e7f0;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .info-item {
            background: #ffffff;
            border: 1px solid #efe6b2;
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: 0 1px 6px rgba(138, 109, 0, 0.06);
        }
        .info-item span {
            display: block;
            font-size: 0.78rem;
            color: #8a6d00;
            opacity: 0.8;
        }
        .info-item strong {
            font-size: 1.05rem;
            color: #4a3b00;
        }
        .image-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 24px;
        }
        #preview-image {
            max-width: 100%;
            max-height: 600px;
            width: auto;
            height: auto;
            border-radius: 12px;
            display: none;
            box-shadow: 0 4px 24px 0 rgba(31, 38, 135, 0.18);
            transition: box-shadow 0.2s;
            margin: 0 auto;
        }
        #preview-image:hover {
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.22);
        }
        .selected-images {
            margin-top: 24px;
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }
        .selected-image {
            margin: 0;
            border: 1.5px solid #e3e8f0;
            border-radius: 7px;
            padding: 7px 7px 4px 7px;
            background: #fff;
            box-shadow: 0 1px 4px 0 rgba(31, 38, 135, 0.07);
            transition: box-shadow 0.2s, border 0.2s;
        }
        .selected-image:hover {
            box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.13);
            border: 1.5px solid #a0b8d8;
        }
        .selected-image img {
            max-width: 110px;
            max-height: 110px;
            border-radius: 5px;
            margin-bottom: 4px;
        }
        .controls {
            margin: 24px 0 0 0;
            text-align: center;
        }
        .btn {
            background: linear-gradient(90deg, #36d1c4 0%, #5b86e5 100%);
            color: white;
            padding: 11px 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.08rem;
            font-weight: 600;
            margin: 0 8px;
            box-shadow: 0 2px 8px 0 rgba(91, 134, 229, 0.10);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            background: linear-gradient(90deg, #5b86e5 0%, #36d1c4 100%);
            box-shadow: 0 4px 16px 0 rgba(91, 134, 229, 0.18);
        }
        .legend {
            display: flex;
            justify-content: center;
            margin: 18px 0 10px 0;
            flex-wrap: wrap;
            gap: 18px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 1.05rem;
            color: #4a6073;
        }
        .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 7px;
            border-radius: 50%;
            border: 2.5px solid #e3e8f0;
            box-shadow: 0 1px 4px 0 rgba(31, 38, 135, 0.07);
        }
        .normal-color { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .anomalous-color { background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%); }
        .boundary-color { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TSNE · knn_distance 边界分析可视化 · 交互式</h1>
            <div class="sub">点击或圈选点查看对应的手部原始图像</div>
            <div class="pills">
                <span class="pill" title="原空间边界文件">features_knn_distance_boundary.npy</span>
                <span class="pill" title="隐空间边界文件">TSNE_knn_distance_boundary.npy</span>
            </div>
        </div>
        <div class="metrics">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-icon">T</div>
                    <div class="metric-content">
                        <strong>总样本数</strong>
                        <span>2414</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon">O</div>
                    <div class="metric-content">
                        <strong>原空间边界点数</strong>
                        <span>250</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon">L</div>
                    <div class="metric-content">
                        <strong>隐空间边界点数</strong>
                        <span>250</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon">W</div>
                    <div class="metric-content">
                        <strong>Wasserstein 距离</strong>
                        <span>0.003727</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-color normal-color"></div>正常</div>
            <div class="legend-item"><div class="legend-color anomalous-color"></div>高维边界（红叉）</div>
            <div class="legend-item"><div class="legend-color boundary-color"></div>低维边界（绿点）</div>
        </div>
        <div class="content">
            <div class="plot-container">
                <h3>交互式散点图</h3>
                <div id="plotly-chart" style="width:100%; height:600px;"></div>
            </div>
            <div class="info-panel">
                <div class="point-info">
                    <h3>点信息</h3>
                    <div id="point-info-content">点击图表中的点查看详细信息</div>
                </div>
                <div class="image-preview">
                    <h3>图像预览</h3>
                    <div id="image-preview-content">
                        <p id="image-caption">选择点后显示对应图像</p>
                        <img id="preview-image" alt="预览图像">
                    </div>
                </div>
                <div class="selected-images">
                    <h3>选中点图像</h3>
                    <div id="selected-images-content">
                        <p>圈选多个点后显示所有图像</p>
                    </div>
                </div>
                <div class="controls">
                    <div id="dirline-tol-controls" style="display:none; margin-bottom:8px;">
                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span style="font-size:0.9rem;color:#5a6d8a;">有向线宽度</span>
                                <span id="dirline-tol-label" style="font-size:0.9rem;color:#5a6d8a;">0.020</span>
                            </div>
                            <div style="display:flex; gap:8px; align-items:center;">
                                <input id="dirline-tol-range" type="range" min="0.001" max="0.1" step="0.001" value="0.02" style="flex:1;">
                                <input id="dirline-tol-number" type="number" min="0.001" max="0.1" step="0.001" value="0.02" style="width:86px;">
                            </div>
                        </div>
                    </div>
                    <button class="btn" onclick="zoomToBoundary()">缩放至边界点</button>
                    <button class="btn" onclick="resetView()">重置视图</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const IMAGE_API_BASE = "http://localhost:5678/api/hand_thumb/TSNE";
    const DATASET_NAME = "yalefaces";
        const pointsData = JSON.parse(document.getElementById('points-data').textContent);
        const boundaryIndices = JSON.parse(document.getElementById('boundary-indices').textContent);
        let plot = null;
        let currentPointIndex = null;
        let selectedPoints = [];
        let currentDragMode = 'pan'; // 默认平移模式

        // 有向线功能：画线（x0,y0）->（x1,y1），按方向投影排序后显示图像
        let directedLine = null; // x0,y0 -> x1,y1
        let directedLineActive = false;
        let directedLineTol = 0.02; // 距离阈值（坐标已归一化到[0,1]）
        let directedLineMax = 1000;  // 最多展示点数（避免一次性加载过多图片）
        let directedLineOnlySegment = true; // 仅统计线段范围内的点（t∈[0,1]）
        let isApplyingDirectedLineRelayout = false; // 防止 relayout 递归
        let directedLineTolUIEnabled = false;

        const DIRECTED_LINE_TOL_MIN = 0.001;
        const DIRECTED_LINE_TOL_MAX = 0.1;
        const DIRECTED_LINE_TOL_STEP = 0.001;

        function clampDirectedLineTol(v) {
            const num = Number(v);
            if (!isFinite(num)) return directedLineTol;
            return Math.min(DIRECTED_LINE_TOL_MAX, Math.max(DIRECTED_LINE_TOL_MIN, num));
        }

        function formatDirectedLineTol(v) {
            const num = Number(v);
            if (!isFinite(num)) return String(v);
            return num.toFixed(3);
        }

        function setDirectedLineTol(nextTol, opts = {}) {
            if (!directedLineTolUIEnabled && !opts.force) {
                return;
            }
            const tol = clampDirectedLineTol(nextTol);
            directedLineTol = tol;

            const rangeEl = document.getElementById('dirline-tol-range');
            const numberEl = document.getElementById('dirline-tol-number');
            const labelEl = document.getElementById('dirline-tol-label');
            if (rangeEl && !opts.skipRange) rangeEl.value = String(tol);
            if (numberEl && !opts.skipNumber) numberEl.value = String(tol);
            if (labelEl) labelEl.textContent = formatDirectedLineTol(tol);

            // 若已经画了有向线，则即时重算命中点与排序结果
            const gd = document.getElementById('plotly-chart');
            if (directedLine && gd && gd.data) {
                applyDirectedLineSelection(gd, directedLine);
            }
        }

        function setDirectedLineTolUIActive(active) {
            directedLineTolUIEnabled = Boolean(active);
            const container = document.getElementById('dirline-tol-controls');
            if (container) {
                container.style.display = directedLineTolUIEnabled ? 'block' : 'none';
            }
        }

        function initDirectedLineTolUI() {
            const rangeEl = document.getElementById('dirline-tol-range');
            const numberEl = document.getElementById('dirline-tol-number');

            if (rangeEl) {
                rangeEl.min = String(DIRECTED_LINE_TOL_MIN);
                rangeEl.max = String(DIRECTED_LINE_TOL_MAX);
                rangeEl.step = String(DIRECTED_LINE_TOL_STEP);
                rangeEl.addEventListener('input', function(e) {
                    setDirectedLineTol(e.target.value, { skipRange: true });
                });
            }
            if (numberEl) {
                numberEl.min = String(DIRECTED_LINE_TOL_MIN);
                numberEl.max = String(DIRECTED_LINE_TOL_MAX);
                numberEl.step = String(DIRECTED_LINE_TOL_STEP);
                numberEl.addEventListener('change', function(e) {
                    setDirectedLineTol(e.target.value, { skipNumber: true });
                });
            }
            // 默认隐藏，仅点击“Dir Line”后才启用

                x: highBoundaryPoints.map(p => p.x),
                y: highBoundaryPoints.map(p => p.y),
                mode: 'markers',
                type: 'scatter',
                name: '高维边界',
                marker: { color: 'red', size: 9, opacity: 0.9, symbol: 'x' },
                selected: { marker: { opacity: 1.0 } },
                unselected: { marker: { opacity: 0.12 } },
                text: highBoundaryPoints.map(p => `索引: ${p.index}<br>类型: 高维边界`),
                hoverinfo: 'text',
                customdata: highBoundaryPoints.map(p => p.index)
            };
            const traceLowBoundary = {
                x: lowBoundaryPoints.map(p => p.x),
                y: lowBoundaryPoints.map(p => p.y),
                mode: 'markers',
                type: 'scatter',
                name: '低维边界',
                marker: { color: 'green', size: 9, opacity: 0.9, symbol: 'circle' },
                selected: { marker: { opacity: 1.0 } },
                unselected: { marker: { opacity: 0.12 } },
                text: lowBoundaryPoints.map(p => `索引: ${p.index}<br>类型: 低维边界`),
                hoverinfo: 'text',
                customdata: lowBoundaryPoints.map(p => p.index)
            };

            const layout = {
                title: '边界分析可视化',
                xaxis: { title: '成分 1 (归一化)' },
                yaxis: { title: '成分 2 (归一化)' },
                hovermode: 'closest',
                showlegend: false,
                height: 600,
                plot_bgcolor: '#fafafa',
                paper_bgcolor: '#ffffff',
                dragmode: 'pan'  // 默认平移模式（由原先的 'zoom' 修改）
            };

            // 自定义工具栏按钮：有向线（画线后按方向排序展示图像）与清除
            const fallbackLineIcon = {
                width: 1000,
                height: 1000,
                path: 'M120,880 L880,120 M760,140 L880,120 L860,240'
            };
            const dirLineIcon = (Plotly.Icons && (Plotly.Icons.drawline || Plotly.Icons.pencil))
                ? (Plotly.Icons.drawline || Plotly.Icons.pencil)
                : fallbackLineIcon;
            const eraseIcon = (Plotly.Icons && (Plotly.Icons.eraseshape || Plotly.Icons.close))
                ? (Plotly.Icons.eraseshape || Plotly.Icons.close)
                : fallbackLineIcon;

            const dirLineButton = {
                name: 'Dir Line',
                title: '画一条有方向的线，并按方向依次显示对应图像',
                icon: dirLineIcon,
                click: function(gd) {
                    activateDirectedLine(gd);
                }
            };
            const clearDirLineButton = {
                name: 'Reset View',
                title: '重置视图',
                icon: eraseIcon,
                click: function(gd) {
                    resetView();
                }
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToAdd: ['toggleHover', 'resetViews', dirLineButton, clearDirLineButton],
                scrollZoom: true
            };
            plot = Plotly.newPlot('plotly-chart', [traceNormal, traceHighBoundary, traceLowBoundary], layout, config);

            document.getElementById('plotly-chart').on('plotly_click', function(data) {
                // 在框选/套索模式下禁用单点预览
                if (currentDragMode === 'lasso' || currentDragMode === 'select' || currentDragMode === 'drawline') {
                    return;
                }
                if (data.points && data.points.length > 0) {
                    const pointIndex = data.points[0].customdata;
                    if (pointIndex !== null && pointIndex !== undefined) {
                        showPointInfo(pointIndex);
                    }
                }
            });
            document.getElementById('plotly-chart').on('plotly_selected', function(data) {
                if (data.points && data.points.length > 0) {
                    selectedPoints = [];
                    data.points.forEach(point => {
                        if (point.customdata !== null && point.customdata !== undefined) {
                            selectedPoints.push(point.customdata);
                        }
                    });
                    showSelectedImages(selectedPoints);
                    // 选择时隐藏单图预览
                    const imgEl = document.getElementById('preview-image');
                    const caption = document.getElementById('image-caption');
                    if (imgEl) { imgEl.style.display = 'none'; imgEl.src = ''; }
                    if (caption) { caption.textContent = `已圈选 ${selectedPoints.length} 个点，单图预览已隐藏`; }
                }
            });
            document.getElementById('plotly-chart').on('plotly_deselect', function() {
                selectedPoints = [];
                document.getElementById('selected-images-content').innerHTML = '<p>圈选多个点后显示所有图像</p>';
                // 取消选择时也重置预览
                const imgEl = document.getElementById('preview-image');
                const caption = document.getElementById('image-caption');
                if (imgEl) { imgEl.style.display = 'none'; imgEl.src = ''; }
                if (caption) { caption.textContent = '选择点后显示对应图像'; }
                // 恢复所有点的高亮（selectedpoints=null），并刷新图表
                Plotly.restyle('plotly-chart', {'selectedpoints': null});
                Plotly.redraw('plotly-chart');
                // 清除图上的框选叠加层（不要清空 shapes，避免误删有向线）
                Plotly.relayout('plotly-chart', {'selections': []});
            });

            // 监听工具切换（拖拽模式变化），当退出框选/套索时清空框选
            document.getElementById('plotly-chart').on('plotly_relayout', function(eventData) {
                const gd = document.getElementById('plotly-chart');

                if (eventData && eventData['dragmode']) {
                    const prevDragMode = currentDragMode;
                    currentDragMode = eventData['dragmode'];
                    // 切换到其它工具（如 Pan/Zoom/Select/Lasso）时，隐藏并禁用宽度滑块
                    if (currentDragMode !== 'drawline') {
                        setDirectedLineTolUIActive(false);
                        directedLineActive = false;
                    }
                    const wasSelect = (prevDragMode === 'lasso' || prevDragMode === 'select');
                    const isSelect = (currentDragMode === 'lasso' || currentDragMode === 'select');
                    // 仅当“退出”圈选/套索时才清空 UI，避免切换到 drawline 时误清空提示信息
                    if (wasSelect && !isSelect) {
                        clearSelectionUI();
                        // 立即恢复全图高光
                        Plotly.restyle('plotly-chart', {'selectedpoints': null});
                        Plotly.redraw('plotly-chart');
                    }
                }

                // 有向线：当 shape 更新（画线完成/编辑）时，解析最新线段并排序展示
                if (!isApplyingDirectedLineRelayout && eventData) {
                    const keys = Object.keys(eventData);
                    const hasShapeUpdate = ('shapes' in eventData) || keys.some(k => k.startsWith('shapes['));
                    if (hasShapeUpdate) {
                        onShapesUpdated(gd);
                    }
                }
            });
        }

        function activateDirectedLine(gd) {
            directedLineActive = true;
            currentDragMode = 'drawline';
            setDirectedLineTolUIActive(true);
            document.getElementById('selected-images-content').innerHTML =
                '<p>有向线模式：在图上拖拽画一条线（起点 → 终点），将按方向依次显示命中点的图像。</p>';
            // 切换到 Plotly 的画线模式
            Plotly.relayout(gd, {'dragmode': 'drawline'});
        }

        function clearDirectedLine(gd) {
            directedLine = null;
            directedLineActive = false;
            isApplyingDirectedLineRelayout = true;
            Plotly.relayout(gd, {'shapes': [], 'annotations': [], 'selections': [], 'dragmode': 'pan'})
                .then(function() { isApplyingDirectedLineRelayout = false; })
                .catch(function() { isApplyingDirectedLineRelayout = false; });
            clearSelectionUI();
            document.getElementById('selected-images-content').innerHTML = '<p>圈选多个点后显示所有图像</p>';
        }

        function onShapesUpdated(gd) {
            // 取当前图上最后一条 line shape 作为“有向线”
            const shapes = (gd && gd.layout && Array.isArray(gd.layout.shapes)) ? gd.layout.shapes : [];
            if (!shapes || shapes.length === 0) {
                return;
            }
            let lastLine = null;
            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                if (s && s.type === 'line' && isFinite(Number(s.x0)) && isFinite(Number(s.y0)) && isFinite(Number(s.x1)) && isFinite(Number(s.y1))) {
                    lastLine = s;
                    break;
                }
            }
            if (!lastLine) {
                return;
            }

            // 规范化并只保留这一条线（避免用户重复画出多条导致歧义）
            const line = {
                x0: Number(lastLine.x0),
                y0: Number(lastLine.y0),
                x1: Number(lastLine.x1),
                y1: Number(lastLine.y1)
            };
            directedLine = line;

            const shapeStyled = Object.assign({}, lastLine, {
                type: 'line',
                xref: 'x',
                yref: 'y',
                line: Object.assign({}, lastLine.line || {}, { color: '#5b86e5', width: 3 })
            });

            const ann = {
                x: line.x1,
                y: line.y1,
                ax: line.x0,
                ay: line.y0,
                xref: 'x',
                yref: 'y',
                axref: 'x',
                ayref: 'y',
                text: '',
                showarrow: true,
                arrowhead: 3,
                arrowsize: 1.1,
                arrowwidth: 2,
                arrowcolor: '#5b86e5'
            };

            isApplyingDirectedLineRelayout = true;
            Plotly.relayout(gd, {'shapes': [shapeStyled], 'annotations': [ann]})
                .then(function() { isApplyingDirectedLineRelayout = false; })
                .catch(function() { isApplyingDirectedLineRelayout = false; });

            applyDirectedLineSelection(gd, line);
        }

        function computeDirectedLineHits(line) {
            const vx = line.x1 - line.x0;
            const vy = line.y1 - line.y0;
            const L2 = vx * vx + vy * vy;
            if (!(L2 > 1e-12)) {
                return [];
            }
            const hits = [];
            for (const p of pointsData) {
                const px = p.x - line.x0;
                const py = p.y - line.y0;
                const t = (px * vx + py * vy) / L2;
                if (directedLineOnlySegment && (t < 0 || t > 1)) {
                    continue;
                }
                const projx = t * vx;
                const projy = t * vy;
                const dx = px - projx;
                const dy = py - projy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist <= directedLineTol) {
                    hits.push({ index: Number(p.index), t: t, dist: dist });
                }
            }
            hits.sort((a, b) => (a.t - b.t) || (a.dist - b.dist) || (a.index - b.index));
            return hits.slice(0, directedLineMax);
        }

        function applySelectedHighlightByIndices(gd, orderedIndices) {
            const indexSet = new Set(orderedIndices.map(x => Number(x)));
            const selNormal = [];
            const selHigh = [];
            const selLow = [];

            for (const idx of indexSet) {
                if (traceIndexToPos.normal.has(idx)) selNormal.push(traceIndexToPos.normal.get(idx));
                if (traceIndexToPos.high.has(idx)) selHigh.push(traceIndexToPos.high.get(idx));
                if (traceIndexToPos.low.has(idx)) selLow.push(traceIndexToPos.low.get(idx));
            }
            // 依次对应 traceNormal/traceHighBoundary/traceLowBoundary
            Plotly.restyle(gd, {'selectedpoints': [selNormal, selHigh, selLow]});
            Plotly.redraw(gd);
        }

        function showDirectedLineImages(hits, line) {
            const selectedImagesContent = document.getElementById('selected-images-content');
            selectedImagesContent.innerHTML = '';

            if (!hits || hits.length === 0) {
                selectedImagesContent.innerHTML = '<p>有向线未命中任何点：可尝试画更长的线，或稍微加大阈值（directedLineTol）。</p>';
                return;
            }

            const header = document.createElement('div');
            header.innerHTML = `
                <p><strong>有向线命中 ${hits.length} 个点</strong>（从起点 → 终点）</p>
                <p style="color:#5a6d8a;font-size:0.88rem; margin-top:6px;">
                    起点(${line.x0.toFixed(3)}, ${line.y0.toFixed(3)}) → 终点(${line.x1.toFixed(3)}, ${line.y1.toFixed(3)})
                    · 距离阈值=${directedLineTol} · 最大展示=${directedLineMax}（避免一次展示过多）
                </p>
            `;
            selectedImagesContent.appendChild(header);

            hits.forEach((h, rank) => {
                const point = pointsData.find(p => Number(p.index) === Number(h.index));
                if (!point) return;
                const imgDiv = document.createElement('div');
                imgDiv.className = 'selected-image';
                const imgUrl = IMAGE_API_BASE + '/' + point.index + '?dataset=' + encodeURIComponent(DATASET_NAME) + '&t=' + Date.now();
                imgDiv.innerHTML = `
                    <div><strong>#${rank + 1} · 索引 ${point.index}</strong></div>
                    <img src="${imgUrl}" alt="手部图像 ${point.index}" style="max-width: 100px; max-height: 100px; cursor:pointer;" onerror="this.style.display='none'">
                    <div>类型: ${point.type}</div>
                    <div style="color:#5a6d8a;font-size:0.82rem;">t=${h.t.toFixed(4)} · dist=${h.dist.toFixed(4)}</div>
                `;
                const imgEl = imgDiv.querySelector('img');
                if (imgEl) {
                    imgEl.onclick = function() {
                        showPointInfo(point.index);
                    };
                }
                selectedImagesContent.appendChild(imgDiv);
            });
        }

        function applyDirectedLineSelection(gd, line) {
            const hits = computeDirectedLineHits(line);
            const ordered = hits.map(h => h.index);
            showDirectedLineImages(hits, line);
            if (ordered.length > 0) {
                applySelectedHighlightByIndices(gd, ordered);
            } else {
                Plotly.restyle(gd, {'selectedpoints': null});
                Plotly.redraw(gd);
            }
        }

        function showPointInfo(pointIndex) {
            // 强制类型一致
            const point = pointsData.find(p => Number(p.index) === Number(pointIndex));
            if (!point) return;

            currentPointIndex = pointIndex;

            const typeBadgeClass = point.type === '正常' ? 'badge-normal' : (point.type === '高维边界' ? 'badge-anomalous' : 'badge-yes');

            document.getElementById('point-info-content').innerHTML = `
                <div class="info-header">
                    <span class="chip" title="唯一索引"><span class="dot"></span> ID #${point.index}</span>
                    <span class="badge ${typeBadgeClass}" title="样本类型">类型: ${point.type}</span>
                </div>
                <div class="info-grid">
                    <div class="info-item"><span>坐标 X</span><strong>${point.x.toFixed(5)}</strong></div>
                    <div class="info-item"><span>坐标 Y</span><strong>${point.y.toFixed(5)}</strong></div>
                </div>
            `;

            const imgElement = document.getElementById('preview-image');
            const caption = document.getElementById('image-caption');
            const imgUrl = IMAGE_API_BASE + '/' + point.index + '?dataset=' + encodeURIComponent(DATASET_NAME) + '&t=' + Date.now(); // 避免缓存

            // 不显示“正在加载图像…”提示，也不在加载前展示占位图片
            // 若需要，可在此保留上一张图片，直到新图加载完成
            imgElement.style.display = 'none';

            // 绑定事件（每次重设，避免堆叠）
            imgElement.onload = function() {
                caption.textContent = '手部图像预览';
                imgElement.style.display = 'block';
            };
            imgElement.onerror = function() {
                caption.textContent = '等待选择';
                imgElement.style.display = 'none';
            };

            imgElement.src = imgUrl;
        }

        function showSelectedImages(pointIndices) {
            const selectedImagesContent = document.getElementById('selected-images-content');
            selectedImagesContent.innerHTML = '';
            if (pointIndices.length === 0) {
                selectedImagesContent.innerHTML = '<p>未选中任何点</p>';
                return;
            }
            selectedImagesContent.innerHTML = `<p>选中了 ${pointIndices.length} 个点</p>`;
            pointIndices = [...new Set(pointIndices)];
            pointIndices.forEach(pointIndex => {
                const point = pointsData.find(p => Number(p.index) === Number(pointIndex));
                if (point) {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'selected-image';
                    const imgUrl = IMAGE_API_BASE + '/' + point.index + '?dataset=' + encodeURIComponent(DATASET_NAME) + '&t=' + Date.now();
                    imgDiv.innerHTML = `
                        <div><strong>索引 ${point.index}</strong></div>
                        <img src="${imgUrl}" alt="手部图像 ${point.index}" style="max-width: 100px; max-height: 100px; cursor:pointer;" onerror="this.style.display='none'">
                        <div>类型: ${point.type}</div>
                    `;
                    // 点击缩略图放大到右侧大图预览
                    imgDiv.querySelector('img').onclick = function() {
                        showPointInfo(point.index);
                    };
                    selectedImagesContent.appendChild(imgDiv);
                }
            });
        }

        function zoomToBoundary() {
            if (boundaryIndices.length === 0) return;
            const boundaryPoints = pointsData.filter(p => p.type === '低维边界');
            const xValues = boundaryPoints.map(p => p.x);
            const yValues = boundaryPoints.map(p => p.y);
            const xRange = [Math.min(...xValues) - 0.1, Math.max(...xValues) + 0.1];
            const yRange = [Math.min(...yValues) - 0.1, Math.max(...yValues) + 0.1];
            Plotly.relayout('plotly-chart', {
                'xaxis.range': xRange,
                'yaxis.range': yRange
            });
        }

        function resetView() {
            directedLine = null;
            directedLineActive = false;
            setDirectedLineTolUIActive(false);
            isApplyingDirectedLineRelayout = true;
            Plotly.relayout('plotly-chart', {
                'xaxis.range': [0, 1],
                'yaxis.range': [0, 1],
                'selections': [],
                'shapes': [],
                'annotations': [],
                'dragmode': 'pan'
            })
                .then(function() { isApplyingDirectedLineRelayout = false; })
                .catch(function() { isApplyingDirectedLineRelayout = false; });
            selectedPoints = [];
            document.getElementById('point-info-content').innerHTML = '点击图表中的点查看详细信息';
            const imgEl = document.getElementById('preview-image');
            const caption = document.getElementById('image-caption');
            if (imgEl) { imgEl.style.display = 'none'; imgEl.src = ''; }
            if (caption) { caption.textContent = '选择点后显示对应图像'; }
            document.getElementById('selected-images-content').innerHTML = '<p>圈选多个点后显示所有图像</p>';
            Plotly.restyle('plotly-chart', {'selectedpoints': null});
        }

        function clearSelectionUI() {
            selectedPoints = [];
            document.getElementById('selected-images-content').innerHTML = '<p>圈选多个点后显示所有图像</p>';
            const imgEl = document.getElementById('preview-image');
            const caption = document.getElementById('image-caption');
            if (imgEl) { imgEl.style.display = 'none'; imgEl.src = ''; }
            if (caption) { caption.textContent = '选择点后显示对应图像'; }
            Plotly.restyle('plotly-chart', {'selectedpoints': null});
            // 同步清除图上的框选/套索轮廓（不要清空 shapes，避免误删有向线）
            Plotly.relayout('plotly-chart', {'selections': []});
        }

        document.addEventListener('DOMContentLoaded', function() {
            initDirectedLineTolUI();
            initPlot();
        });
    </script>
</body>
